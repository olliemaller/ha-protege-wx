name: Release

# When a release is published: check the tag matches the manifest version,
# then attach protege_wx.zip (the integration folder) for manual installs.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/protege_wx/manifest.json'))['version'])")
          echo "Release $tag, manifest $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::The tag (v$tag) doesn't match manifest.json ($manifest). Bump the manifest first."
            exit 1
          fi

      - name: Build protege_wx.zip
        run: |
          cd custom_components/protege_wx
          find . -name '__pycache__' -prune -exec rm -rf {} +
          zip -r -X "$GITHUB_WORKSPACE/protege_wx.zip" . -x '*.pyc'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" protege_wx.zip --clobber

      # The Marketplace shows the release notes in Settings > Updates. If the
      # release was published without notes, use this version's CHANGELOG.md
      # section.
      - name: Fill in empty release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          if [ -n "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "Release notes already written"; exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "::warning::No CHANGELOG.md section for $version"
          fi
