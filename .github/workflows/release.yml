name: Release

# Two ways to release:
# - Bump "version" in manifest.json and add its CHANGELOG.md section, then push to main.
#   The "publish" job creates the tag and release (with notes and the zip) by itself.
# - Or publish a release by hand on GitHub; the "zip" job checks the version and attaches the zip.

on:
  push:
    branches: [main]
    paths: ["custom_components/protege_wx/manifest.json"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/protege_wx/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build protege_wx.zip
        if: steps.check.outputs.new == 'true'
        run: |
          cd custom_components/protege_wx
          find . -name '__pycache__' -prune -exec rm -rf {} +
          zip -r -X "$GITHUB_WORKSPACE/protege_wx.zip" . -x '*.pyc'

      - name: Release notes from CHANGELOG.md
        if: steps.check.outputs.new == 'true'
        run: |
          version="${{ steps.check.outputs.version }}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section. Add one before bumping the version."
            exit 1
          fi

      - name: Publish v${{ steps.check.outputs.version }}
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.check.outputs.version }}"
          gh release create "v$v" protege_wx.zip --target "$GITHUB_SHA" --title "v$v" --notes-file notes.md

  zip:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/protege_wx/manifest.json'))['version'])")
          echo "Release $tag, manifest $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::The tag (v$tag) doesn't match manifest.json ($manifest). Bump the manifest first."
            exit 1
          fi

      - name: Build protege_wx.zip
        run: |
          cd custom_components/protege_wx
          find . -name '__pycache__' -prune -exec rm -rf {} +
          zip -r -X "$GITHUB_WORKSPACE/protege_wx.zip" . -x '*.pyc'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" protege_wx.zip --clobber

      # The Marketplace shows the release notes in Settings > Updates. If the
      # release was published without notes, use this version's CHANGELOG.md
      # section.
      - name: Fill in empty release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          if [ -n "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "Release notes already written"; exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            echo "::warning::No CHANGELOG.md section for $version"
          fi
