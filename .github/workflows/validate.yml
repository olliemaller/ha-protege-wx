name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # The Marketplace catalogue only accepts a clean run: no ignored checks.
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2025.6"
            python: "3.13"
            harness: "pytest-homeassistant-custom-component==0.13.252"
            extra: '"pycares<5"'
          # Home Assistant 2026.3 and later need Python 3.14.
          - ha: latest
            python: "3.14"
            harness: "pytest-homeassistant-custom-component"
            extra: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.harness }}" ${{ matrix.extra }} ruff
      - name: Install Assist's requirements (for the voice tests)
        run: |
          python - <<'PY' > assist-requirements.txt
          import json, pathlib, homeassistant
          manifest = pathlib.Path(homeassistant.__file__).parent / "components/conversation/manifest.json"
          print("\n".join(json.loads(manifest.read_text())["requirements"]))
          PY
          pip install -r assist-requirements.txt
      - run: ruff check --select E,F,W,B,UP,SIM,I --ignore E501,B904,B017 custom_components tests
      - run: pytest -q

  # Boots a real Home Assistant core (the newest release, and the beta) against
  # the fake controller, so a breaking change shows up before it ships.
  smoke:
    name: smoke test (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant
        run: |
          if [ "${{ matrix.ha }}" = beta ]; then pip install --pre homeassistant; else pip install homeassistant; fi
      - run: python tests/smoke.py
