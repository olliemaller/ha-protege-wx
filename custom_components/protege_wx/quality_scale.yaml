# Home Assistant integration quality scale: where this integration stands.
# https://contributors.home-assistant.io/core/quality-scale/rules/
# Custom integrations can't declare a tier in manifest.json, so this file is
# a self-assessment against every rule up to Platinum.
rules:
  # Bronze
  action-setup:
    status: done
    comment: Every action is registered in async_setup and refuses with a translated error when no loaded entry has the target. protege_wx.lockdown is registered as an admin-only action.
  appropriate-polling:
    status: done
    comment: 1 s by default for area and zone status and the newest event log page; doors, troubles and outputs on change and every 5 s; health every minute.
  brands:
    status: done
    comment: Icons, logos and dark variants in custom_components/protege_wx/brand/.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: Every config, discovery, reauth, reconfigure and options path is tested (config_flow.py 97%).
  dependency-transparency:
    status: done
    comment: aioprotegewx is MIT, on PyPI, and published from GitHub Actions with trusted publishing.
  docs-actions: done
  docs-conditions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 99% overall and at least 95% in every module; CI fails below 95%.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: DHCP, by ICT's MAC address prefix (00:1B:C2) and registered devices.
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: done
    comment: docs/Installation.md lists the supported controller (Protege WX over plain HTTP) and what isn't. Only web interface 2.3.x is tested on real hardware; older ones only against a simulated controller, and the docs say so.
  docs-supported-functions: done
  docs-troubleshooting:
    status: done
    comment: docs/Troubleshooting.md covers known limits, diagnostics, and debug logging for both loggers (the UI button or configuration.yaml).
  docs-use-cases:
    status: done
    comment: docs/Automations.md (blueprints for notifications, auto arm and door schedules) and the examples in docs/Actions.md.
  dynamic-devices:
    status: done
    comment: The Rescan controller button adds areas, doors, inputs and outputs created since setup. Outputs not chosen in the options are added disabled.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: Uses async_create_clientsession with its own unsafe cookie jar (the controller sets its login cookie on a bare IP address), on Home Assistant's connection pool, and passes it to aioprotegewx.
  strict-typing:
    status: done
    comment: mypy --strict is clean and checked in CI; aioprotegewx ships py.typed.
