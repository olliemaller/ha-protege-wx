arm:
  target:
    entity:
      integration: protege_wx
      domain: alarm_control_panel
  fields:
    mode:
      required: true
      default: away
      selector:
        select:
          options:
            - away
            - stay
            - instant
    force:
      default: false
      selector:
        boolean:
    code:
      selector:
        text:
          type: password

unlock_door:
  target:
    entity:
      integration: protege_wx
      domain: lock
  fields:
    hold_open:
      default: false
      selector:
        boolean:

bypass:
  target:
    entity:
      integration: protege_wx
      domain: binary_sensor
  fields:
    mode:
      required: true
      default: temporary
      selector:
        select:
          options:
            - none
            - temporary
            - permanent
    code:
      selector:
        text:
          type: password

pulse_output:
  target:
    entity:
      integration: protege_wx
      domain: switch
  fields:
    seconds:
      required: true
      default: 5
      selector:
        number:
          min: 1
          max: 65535
          unit_of_measurement: s
          mode: box
