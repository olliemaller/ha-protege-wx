[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# The same rules the checks run on every push.
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "B904", "B017"]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from test_integration are redefined as test arguments.
"tests/test_coverage.py" = ["F811"]
"tests/test_review_fixes.py" = ["F811"]
"tests/test_lockdown_outputs.py" = ["F811"]
